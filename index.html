<DOCTYPE html>
    <html>
        <head>
            <style>
                body{
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items:center;
                    min-height: 100vh;
                    margin: 0;
                    padding: 0;
                    background:linear-gradient(to right, rgb(112, 14, 55),rgba(28, 7, 75, 0.863));
                    background-attachment: fixed;
                    
                }
                .container{
                    padding: 20px;
                    font-size: small;
                    background-color: rgb(216, 210, 223);
                    border-radius: 14px;
                    width: 315px;
                    height: auto;
                    position: sticky;
                    top: 4px;
                    z-index: 100;
                    
                }
                h1{
                    text-align: center;
                    font-size: x-large;
                }
                input{
                    height: 35px;
                    width: 230px;
                    font-size: larger;
                }
                .tick{
                    display: none;
                }
                .completed .tick{
                    display: inline;
                }
                button{
                    height: 35px;
                    width: 60px;
                    background: linear-gradient(to right,rgb(190, 97, 21),rgb(201, 130, 153));
                    border-radius: 16px;
                }
                .edit-button{
                    background: orange;
                }
                .delete-button{
                    background: rgb(235, 66, 66);
                }
                li{
                    padding: 15px;
                    font-size: medium;
                    background-color: #f1f1f1;
                    margin-top: 10px;
                    border-radius: 10px;
                    list-style: none;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    

                }
                
                li:hover{
                    transform: scale(1.04);
                    background-color: rgb(218, 181, 213);
                    
                }

                
                #result{
                    width: 325px;
                    margin: auto;
                    padding: 0;
                   
                   
                   
                }
                #error{
                    font-size: large;
                    color: rgb(185, 17, 17);
                }
            </style>
            </head>
            <body>
                <div class="container">
                <h1>To-Do-List</h1>
                <p id="error"></p>
                <input type="text"  id="userTask" placeholder="Enter your task" onkeydown="handleEnter(event)">
                
                <button onclick="showTask()">Add</button>
                 
                 </div>
                  <ul id="result"></ul>
               
                <script src="script.js"></script>
                </body>
                </html>
